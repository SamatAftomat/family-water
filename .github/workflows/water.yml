name: Water Bot Test
on:
  schedule:
    # 14:30 - 14:50 UTC (это 17:30 - 17:50 по Москве)
    # */5 означает каждые 5 минут
    - cron: '30-50/5 14 * * *'
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  ping-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel
        run: |
          curl -s "https://family-water.vercel.app/api/cron?key=water_secret_2024"
